name: marketplace-profit-app
region: nyc

services:
  - name: web
    github:
      repo: TU_USUARIO/marketplace-profit-app
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    routes:
      - path: /
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: PORT
        value: "8080"
